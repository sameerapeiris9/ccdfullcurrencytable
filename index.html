<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>FX Positions</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  font-family:'Inter',sans-serif;

  background:
    radial-gradient(circle at top left,#f8fbff,#eef3f8);

  padding:10px;
}

/* PANEL */

.panel{

  width:100%;
  height:100%;

  background:rgba(255,255,255,.92);

  border:1px solid rgba(255,255,255,.8);

  border-radius:22px;

  backdrop-filter:blur(18px);

  box-shadow:
    0 10px 30px rgba(15,23,42,.06),
    0 1px 2px rgba(15,23,42,.03);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{

  padding:18px 20px 12px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid #eef2f7;
}

.title{
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  color:#64748b;
}

.live{

  display:flex;
  align-items:center;
  gap:8px;

  font-size:11px;
  font-weight:700;

  color:#16a34a;
}

.live-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#16a34a;

  animation:pulse 1.8s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.7);
    opacity:.35;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

/* LIST */

.list{

  flex:1;

  overflow:auto;

  padding:10px;
}

/* ROW */

.row{

  position:relative;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:14px 16px;

  margin-bottom:10px;

  border-radius:18px;

  background:white;

  border:1px solid #edf2f7;

  transition:.25s ease;

  overflow:hidden;
}

.row:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 20px rgba(15,23,42,.06);
}

.row::before{

  content:'';

  position:absolute;

  left:0;
  top:0;

  width:4px;
  height:100%;

  background:var(--accent);
}

/* LEFT */

.left{

  display:flex;
  align-items:center;

  gap:12px;

  min-width:0;
}

/* ICON */

.icon-wrap{

  width:38px;
  height:38px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    color-mix(in srgb,var(--accent) 12%, white);

  flex-shrink:0;
}

.icon{

  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--accent);

  box-shadow:
    0 0 0 5px color-mix(in srgb,var(--accent) 18%, white);
}

/* TEXT */

.info{

  display:flex;
  flex-direction:column;
  gap:4px;

  min-width:0;
}

.code{

  font-size:13px;
  font-weight:800;

  color:#0f172a;

  letter-spacing:.08em;
}

.sub{

  font-size:11px;

  color:#94a3b8;
}

/* RIGHT */

.right{

  display:flex;
  flex-direction:column;
  align-items:flex-end;

  gap:6px;

  flex-shrink:0;
}

.value{

  font-size:22px;
  font-weight:800;

  color:#0f172a;

  letter-spacing:-0.03em;

  font-variant-numeric:tabular-nums;
}

/* CHANGE */

.change{

  font-size:11px;
  font-weight:700;

  padding:4px 9px;

  border-radius:999px;

  font-variant-numeric:tabular-nums;
}

.up{
  background:#dcfce7;
  color:#15803d;
}

.down{
  background:#fee2e2;
  color:#b91c1c;
}

.flat{
  background:#eff6ff;
  color:#2563eb;
}

/* LOADING */

.loading{

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#64748b;

  font-size:14px;
  font-weight:600;
}

</style>
</head>

<body>

<div class="panel">

  <div class="header">

    <div class="title">
      FOREIGN CURRENCY POSITIONS
    </div>

    <div class="live">

      <div class="live-dot"></div>

      LIVE

    </div>

  </div>

  <div class="list" id="list">

    <div class="loading">
      Loading FX Positions...
    </div>

  </div>

</div>

<script>

'use strict';

/* COLORS */

const COLORS={

  USD:'#2563eb',
  EUR:'#003399',
  GBP:'#7c3aed',
  AUD:'#06b6d4',
  JPY:'#e11d48',
  CAD:'#dc2626',
  CHF:'#ef4444',
  SGD:'#ec4899',
  CNY:'#f97316',
  INR:'#fb923c',
  KWD:'#16a34a',
  SAR:'#059669',
  AED:'#14b8a6',
  HKD:'#ea580c',
  THB:'#9333ea',
  MYR:'#be123c',
  BHD:'#dc2626',
  OMR:'#ef4444',
  NZD:'#2563eb',
  SEK:'#0284c7',
  DKK:'#a21caf',
  NOK:'#dc2626',
  QAR:'#881337',
  JOD:'#15803d',

  default:'#64748b'

};

/* FORMAT */

function formatNumber(n){

  if(n===null || isNaN(n)) return '—';

  return Number(n).toLocaleString();

}

/* CREATE ROW */

function createRow(currency,value,change){

  const color=COLORS[currency] || COLORS.default;

  let direction='flat';

  if(change > 0){
    direction='up';
  }
  else if(change < 0){
    direction='down';
  }

  const sign=change > 0 ? '+' : '';

  const row=document.createElement('div');

  row.className='row';

  row.style.setProperty('--accent',color);

  row.innerHTML=`

    <div class="left">

      <div class="icon-wrap">

        <div class="icon"></div>

      </div>

      <div class="info">

        <div class="code">
          ${currency}
        </div>

        <div class="sub">
          Treasury Position
        </div>

      </div>

    </div>

    <div class="right">

      <div class="value">
        ${formatNumber(value)}
      </div>

      <div class="change ${direction}">
        ${sign}${formatNumber(change)}
      </div>

    </div>

  `;

  return row;

}

/* RENDER */

function render(rows){

  const list=document.getElementById('list');

  list.innerHTML='';

  rows.forEach(row=>{

    const el=createRow(
      row.currency,
      row.value,
      row.change
    );

    list.appendChild(el);

  });

}

/* LOAD DATA */

async function loadData(){

  try{

    const worksheet=
      tableau.extensions.worksheetContent.worksheet;

    const reader=
      await worksheet.getSummaryDataReaderAsync();

    let rows=[];

    for(let p=0;p<reader.pageCount;p++){

      const page=
        await reader.getPageAsync(p);

      page.data.forEach(r=>{

        rows.push({

          currency:
            r[0]?.formattedValue || '',

          value:
            Number(r[1]?.value || 0),

          change:
            Number(r[2]?.value || 0)

        });

      });

    }

    await reader.releaseAsync();

    render(rows);

  }
  catch(err){

    console.error(err);

    document.getElementById('list').innerHTML=`

      <div class="loading">
        Unable to load Tableau data
      </div>

    `;

  }

}

/* INIT */

window.onload=async function(){

  await tableau.extensions.initializeAsync();

  const worksheet=
    tableau.extensions.worksheetContent.worksheet;

  await loadData();

  worksheet.addEventListener(
    tableau.TableauEventType.SummaryDataChanged,
    loadData
  );

};

</script>

</body>
</html>
