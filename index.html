<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Compact FX Positions</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
}

body{

  width:100%;
  height:100vh;

  overflow:hidden;

  background:
    radial-gradient(circle at top left,#f8fbff,#eef3f8);

  font-family:'Inter',sans-serif;

  padding:8px;
}

/* PANEL */

.panel{

  width:100%;
  height:100%;

  background:rgba(255,255,255,.92);

  backdrop-filter:blur(16px);

  border-radius:20px;

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 8px 25px rgba(15,23,42,.06);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{

  height:42px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  border-bottom:1px solid #eef2f7;
}

.title{

  font-size:11px;

  font-weight:800;

  letter-spacing:.18em;

  color:#64748b;
}

.live{

  display:flex;
  align-items:center;
  gap:7px;

  font-size:10px;
  font-weight:700;

  color:#16a34a;
}

.dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#16a34a;

  animation:pulse 1.8s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.7);
    opacity:.35;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

/* GRID */

.grid{

  flex:1;

  overflow:auto;

  padding:10px;

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

  gap:8px;
}

/* CARD */

.card{

  position:relative;

  height:62px;

  border-radius:16px;

  background:white;

  border:1px solid #edf2f7;

  padding:10px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  overflow:hidden;

  transition:.22s ease;
}

.card:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 18px rgba(15,23,42,.06);
}

.card::before{

  content:'';

  position:absolute;

  left:0;
  top:0;

  width:3px;
  height:100%;

  background:var(--accent);
}

/* LEFT */

.left{

  display:flex;
  align-items:center;

  gap:10px;

  min-width:0;
}

/* ICON */

.icon-wrap{

  width:28px;
  height:28px;

  border-radius:10px;

  background:
    color-mix(in srgb,var(--accent) 12%, white);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.icon{

  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--accent);

  box-shadow:
    0 0 0 4px color-mix(in srgb,var(--accent) 15%, white);
}

/* TEXT */

.text{

  display:flex;
  flex-direction:column;

  gap:3px;

  min-width:0;
}

.code{

  font-size:12px;
  font-weight:800;

  letter-spacing:.08em;

  color:#0f172a;
}

.value{

  font-size:15px;
  font-weight:700;

  color:#475569;

  font-variant-numeric:tabular-nums;

  white-space:nowrap;
}

/* CHANGE */

.change{

  flex-shrink:0;

  padding:4px 8px;

  border-radius:999px;

  font-size:10px;
  font-weight:700;

  font-variant-numeric:tabular-nums;
}

.up{
  background:#dcfce7;
  color:#15803d;
}

.down{
  background:#fee2e2;
  color:#b91c1c;
}

.flat{
  background:#eff6ff;
  color:#2563eb;
}

/* LOADING */

.loading{

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#64748b;

  font-size:13px;
  font-weight:600;
}

</style>
</head>

<body>

<div class="panel">

  <div class="header">

    <div class="title">
      FOREIGN CURRENCY POSITIONS
    </div>

    <div class="live">

      <div class="dot"></div>

      LIVE

    </div>

  </div>

  <div class="grid" id="grid">

    <div class="loading">
      Loading FX Positions...
    </div>

  </div>

</div>

<script>

'use strict';

/* COLORS */

const COLORS={

  USD:'#2563eb',
  EUR:'#003399',
  GBP:'#7c3aed',
  AUD:'#06b6d4',
  JPY:'#e11d48',
  CAD:'#dc2626',
  CHF:'#ef4444',
  SGD:'#ec4899',
  CNY:'#f97316',
  INR:'#fb923c',
  KWD:'#16a34a',
  SAR:'#059669',
  AED:'#14b8a6',
  HKD:'#ea580c',
  THB:'#9333ea',
  MYR:'#be123c',
  BHD:'#dc2626',
  OMR:'#ef4444',
  NZD:'#2563eb',
  SEK:'#0284c7',
  DKK:'#a21caf',
  NOK:'#dc2626',
  QAR:'#881337',
  JOD:'#15803d',

  default:'#64748b'
};

/* FORMAT */

function formatNumber(n){

  if(n===null || isNaN(n)) return '—';

  return Number(n).toLocaleString();

}

/* CREATE CARD */

function createCard(currency,value,change){

  const color=
    COLORS[currency] || COLORS.default;

  let direction='flat';

  if(change > 0){
    direction='up';
  }
  else if(change < 0){
    direction='down';
  }

  const sign=
    change > 0 ? '+' : '';

  const card=document.createElement('div');

  card.className='card';

  card.style.setProperty('--accent',color);

  card.innerHTML=`

    <div class="left">

      <div class="icon-wrap">

        <div class="icon"></div>

      </div>

      <div class="text">

        <div class="code">
          ${currency}
        </div>

        <div class="value">
          ${formatNumber(value)}
        </div>

      </div>

    </div>

    <div class="change ${direction}">
      ${sign}${formatNumber(change)}
    </div>

  `;

  return card;

}

/* RENDER */

function render(rows){

  const grid=
    document.getElementById('grid');

  grid.innerHTML='';

  rows.forEach(row=>{

    grid.appendChild(

      createCard(
        row.currency,
        row.value,
        row.change
      )

    );

  });

}

/* LOAD DATA */

async function loadData(){

  try{

    const worksheet=
      tableau.extensions
      .worksheetContent
      .worksheet;

    const reader=
      await worksheet
      .getSummaryDataReaderAsync();

    let rows=[];

    for(let p=0;p<reader.pageCount;p++){

      const page=
        await reader.getPageAsync(p);

      page.data.forEach(r=>{

        rows.push({

          currency:
            r[0]?.formattedValue || '',

          value:
            Number(r[1]?.value || 0),

          change:
            Number(r[2]?.value || 0)

        });

      });

    }

    await reader.releaseAsync();

    render(rows);

  }
  catch(err){

    console.error(err);

    document.getElementById('grid').innerHTML=`

      <div class="loading">
        Unable to load Tableau data
      </div>

    `;

  }

}

/* INIT */

window.onload=async function(){

  await tableau.extensions.initializeAsync();

  const worksheet=
    tableau.extensions
    .worksheetContent
    .worksheet;

  await loadData();

  worksheet.addEventListener(
    tableau.TableauEventType
    .SummaryDataChanged,
    loadData
  );

};

</script>

</body>
</html>
